rmcs_executor:
  ros__parameters:
    update_rate: 1000.0

    components:
      - rmcs_core::hardware::GantryControlHardware -> gantry_control_hardware

      - rmcs_core::controller::GantryController -> gantry_controller

      - rmcs_core::broadcaster::ValueBroadcaster -> value_broadcaster

gantry_control_hardware:
  ros__parameters:
    board_serial: ""

gantry_controller:
  ros__parameters:
    horizontal_max_velocity: 10.0 # Output shaft rad/s at full stick
    up_max_velocity: 10.0
    joystick_deadzone: 0.05
    # Double-middle: capture current IMU pitch, then adjust/hold it with right stick X.
    pitch_target_rate: 0.1 # rad/s at full stick
    pitch_target_span: 0.1745329252 # +/-10 degrees from the captured angle; target soft limit
    pitch_motor_direction: -1.0 # Motor velocity sign that increases IMU pitch; verify on hardware
    pitch_kp: 1.0 # Pitch error in radians -> motor speed in rad/s
    pitch_ki: 0.0
    pitch_kd: 0.0
    pitch_integral_min: -1.0
    pitch_integral_max: 1.0
    pitch_output_min: -2.0
    pitch_output_max: 2.0
    left_zero_angle: 1.4 # Bottom reference, output shaft rad
    right_zero_angle: -0.5
    sync_velocity_kp: 0.05 # Cross-coupled velocity difference compensation
    sync_kp: 0.1 # Position error (rad) -> differential velocity (rad/s); both switches MIDDLE
    max_sync_velocity: 2.0 # Maximum correction per motor, rad/s
    left_velocity_kp: 0.3036926
    left_velocity_ki: 0.0
    left_velocity_kd: 0.009373434
    left_velocity_output_min: -0.18
    left_velocity_output_max: 0.18
    right_velocity_kp: 0.3036926
    right_velocity_ki: 0.0
    right_velocity_kd: 0.009373434
    right_velocity_output_min: -0.18
    right_velocity_output_max: 0.18
    up_velocity_kp: 0.3036926
    up_velocity_ki: 0.0
    up_velocity_kd: 0.009373434
    up_velocity_output_min: -0.18
    up_velocity_output_max: 0.18

value_broadcaster:
  ros__parameters:
    forward_list:
      - /gantry/pitch/target
      - /gantry/pitch/error
      - /gantry/imu/roll
      - /gantry/imu/pitch
      - /gantry/imu/yaw
      - /dart/left_motor/velocity
      - /dart/left_motor/angle
      - /dart/left_motor/torque
      - /dart/left_motor/control_velocity
      - /dart/left_motor/control_torque
      - /dart/right_motor/velocity
      - /dart/right_motor/angle
      - /dart/right_motor/torque
      - /dart/right_motor/control_velocity
      - /dart/right_motor/control_torque
      - /dart/up_motor/velocity
      - /dart/up_motor/angle
      - /dart/up_motor/torque
      - /dart/up_motor/control_velocity
      - /dart/up_motor/control_torque



