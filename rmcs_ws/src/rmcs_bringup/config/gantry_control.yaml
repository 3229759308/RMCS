rmcs_executor:
  ros__parameters:
    update_rate: 1000.0

    components:
      - rmcs_core::hardware::GantryControlHardware -> gantry_control_hardware

      - rmcs_core::controller::GantryController -> gantry_controller
      - rmcs_core::controller::pid::PidController -> gantry_pitch_pid_controller
      - rmcs_core::controller::pid::PidController -> left_velocity_pid_controller
      - rmcs_core::controller::pid::PidController -> right_velocity_pid_controller
      - rmcs_core::controller::pid::PidController -> up_velocity_pid_controller

      - rmcs_core::broadcaster::ValueBroadcaster -> value_broadcaster
      - rmcs_core::debug::ValueCollector -> value_collector

gantry_control_hardware:
  ros__parameters:
    board_serial: ""

gantry_controller:
  ros__parameters:
    horizontal_max_velocity: 10.0 # Output shaft rad/s at full stick
    up_max_velocity: 10.0 # Yaw (up_motor) output-shaft rad/s at full right-stick left/right
    joystick_deadzone: 0.05
    # Both switches UP: find and record dynamic left/right zeros in controller memory.
    homing_speed: 1.0 # Positive magnitude in rad/s; downward command is negative
    homing_velocity_threshold: 0.02 # rad/s; near-zero speed after downward motion
    homing_torque_threshold: 0.01 # N*m; minimum absolute torque at the stop
    homing_confirm_time: 0.1 # Seconds of continuous stop detection
    homing_timeout: 1000000.0 # Seconds before aborting homing
    # Left UP / right MIDDLE after homing: right-stick UP/DOWN adjusts pitch; LEFT/RIGHT controls yaw speed.
    pitch_target_rate: 0.005 # Adjustable rad/s magnitude; full right-stick UP decreases target; centered stick holds
    pitch_max_offset: 0.5 # Target range +/-rad relative to the angle captured on mode entry
    pitch_velocity_direction: 1.0 # Set to -1.0 if positive motor velocity decreases IMU roll
    sync_kp: 0.1 # Multi-turn position error -> differential velocity; both-MIDDLE and pitch mode
    max_sync_velocity: 2.0 # Maximum correction per motor, rad/s

gantry_pitch_pid_controller:
  ros__parameters:
    measurement: /gantry/pitch/measurement
    setpoint: /gantry/pitch/target
    control: /gantry/pitch/control_velocity
    kp: 10000.0 # Pitch error rad -> common left/right output-shaft rad/s; tune on hardware
    ki: 0.0
    kd: 1000.0
    output_min: -10.0
    output_max: 10.0

left_velocity_pid_controller:
  ros__parameters:
    measurement: /dart/left_motor/velocity
    setpoint: /dart/left_motor/control_velocity
    control: /dart/left_motor/control_torque
    kp: 0.3036926
    ki: 0.0
    kd: 0.009373434
    output_min: -0.18 # Output shaft N*m; about -1 A with default M2006 gearing
    output_max: 0.18

right_velocity_pid_controller:
  ros__parameters:
    measurement: /dart/right_motor/velocity
    setpoint: /dart/right_motor/control_velocity
    control: /dart/right_motor/control_torque
    kp: 0.3036926
    ki: 0.0
    kd: 0.009373434
    output_min: -0.18 # Output shaft N*m; about -1 A with default M2006 gearing
    output_max: 0.18

up_velocity_pid_controller:
  ros__parameters:
    measurement: /dart/up_motor/velocity
    setpoint: /dart/up_motor/control_velocity
    control: /dart/up_motor/control_torque
    kp: 0.3036926
    ki: 0.0
    kd: 0.009373434
    output_min: -0.18 # Output shaft N*m; about -1 A with default M2006 gearing
    output_max: 0.18

value_collector:
  ros__parameters:
    csv_path: "/tmp/gantry_motion_<timestamp>.csv"
    # At update_rate=1000 Hz: 200 samples/s, nominal time = index * 0.005 s.
    write_interval: 5
    flush_interval: 200 # Flush every 1 second of samples.
    signals:
      # Pitch tracking: angles in rad, PID velocity output in rad/s.
      - /gantry/pitch/target
      - /gantry/pitch/measurement
      - /gantry/pitch/control_velocity
      # Board orientation in rad; gantry pitch uses IMU roll.
      - /gantry/imu/roll
      - /gantry/imu/pitch
      - /gantry/imu/yaw
      # Output-shaft angle (rad), velocity (rad/s), torque (N*m).
      - /dart/left_motor/angle
      - /dart/left_motor/velocity
      - /dart/left_motor/control_velocity
      - /dart/left_motor/torque
      - /dart/left_motor/control_torque
      - /dart/right_motor/angle
      - /dart/right_motor/velocity
      - /dart/right_motor/control_velocity
      - /dart/right_motor/torque
      - /dart/right_motor/control_torque
      # up_motor is yaw; velocity control has no angle setpoint.
      - /dart/up_motor/angle
      - /dart/up_motor/velocity
      - /dart/up_motor/control_velocity
      - /dart/up_motor/torque
      - /dart/up_motor/control_torque

value_broadcaster:
  ros__parameters:
    forward_list:
      - /gantry/pitch/measurement
      - /gantry/pitch/target
      - /gantry/pitch/control_velocity
      - /gantry/imu/roll
      - /gantry/imu/pitch
      - /gantry/imu/yaw
      - /dart/left_motor/velocity
      - /dart/left_motor/angle
      - /dart/left_motor/torque
      - /dart/left_motor/control_velocity
      - /dart/left_motor/control_torque
      - /dart/right_motor/velocity
      - /dart/right_motor/angle
      - /dart/right_motor/torque
      - /dart/right_motor/control_velocity
      - /dart/right_motor/control_torque
      - /dart/up_motor/velocity
      - /dart/up_motor/angle
      - /dart/up_motor/torque
      - /dart/up_motor/control_velocity
      - /dart/up_motor/control_torque



